<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page introuvable | Studio Granit</title>
  <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
  <style>
    :root { --primary: #0149ad; --dark: #1a1a2e; --bg: #f2f0ed; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .code { font-size: 5rem; font-weight: 900; color: var(--primary); line-height: 1; }
    h1 { font-size: 1.5rem; margin: 1rem 0 0.5rem; }
    p { color: #5d6470; margin-bottom: 1.5rem; }
    a.btn {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      padding: 0.9rem 1.6rem;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Cette page n'existe pas (ou plus)</h1>
    <p>Même taillé dans le granit, un lien peut se perdre. Revenez à l'accueil, tout y est.</p>
    <a class="btn" href="/">Retour à l'accueil</a>
  </main>
</body>
</html>
